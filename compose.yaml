services:
  postgres:
    image: postgres:17.7
    restart: unless-stopped
    container_name: postgres
    hostname: postgres
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data:z
    env_file:
      - ./.env
    expose:
      - "${POSTGRES_PORT}"
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test:
        [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 60s
      retries: 2
      start_period: 3s
      timeout: 3s

  xraise-be:
    restart: unless-stopped
    container_name: xraise_be
    hostname: xraisebe # underscore make it invalid (RFC 1034/1035)
    build:
      context: ./XRaiseBE
    depends_on:
      postgres:
        condition: service_healthy
    # volumes:
    #   - "./volumes/xraise_be/logs:/app/logs"
    #   - "./volumes/xraise_be/media:/app/media"
    env_file:
      - ./XRaiseBE/.env
    # expose:
    #   - "8000"
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  xraise-fe:
    restart: unless-stopped
    container_name: xraise_fe
    hostname: xraisefe # underscore make it invalid (RFC 1034/1035)
    build:
      context: ./XRaiseFE
    env_file:
      - ./XRaiseFE/.env
    # expose:
    #   - "3000"
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
